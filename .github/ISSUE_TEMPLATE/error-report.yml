name: Something returned an error
description: An error from the GitHub MCP endpoint or from the REST API
title: "[error] "
body:
  - type: markdown
    attributes:
      value: |
        Copy the response. Do not retype it.

        Four different causes produce four different strings, and which string
        you got is the whole diagnosis. `missing required Authorization header`
        and `token authentication failed` mean opposite things.
  - type: textarea
    id: response
    attributes:
      label: The exact response
      description: Status line, headers you can see, and the body.
      render: text
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: How it connects
      options:
        - MCP endpoint, OAuth
        - MCP endpoint, token in a header
        - REST, from a script
        - REST, through a client
        - Not sure
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and version
      placeholder: RikkaHub on Android 10 / Claude Desktop / a script
  - type: textarea
    id: tried
    attributes:
      label: What you already tried
      description: A new token, a different client, a different endpoint. Say what changed the response, if anything.
